name: nature_walk
description: Explore nature and learn about real plants, birds, and fish.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_tiled: ^1.18.0
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  http: ^1.2.0
  lottie: ^3.1.0
  path_provider: ^2.1.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/ui/
    - assets/images/creatures/
    - assets/images/backgrounds/
    - assets/images/tiles/
